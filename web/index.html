<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QRIS Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF4E0;--ink:#1E1B2E;--lav:#CDBBFF;--mint:#B6F0CF;--peach:#FFCBA8;--yel:#FFE48A;--pink:#FFB7D0;--sh:4px 4px 0 var(--ink);--chip:#BDE3FF}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%}
body{font-family:'Space Grotesk',system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:14px 12px 40px;background-image:radial-gradient(var(--ink) 1px,transparent 1px);background-size:22px 22px}
.wrap{width:100%;max-width:560px;margin:0 auto}
.stack{display:flex;flex-direction:column;gap:14px;width:100%}
.card{width:100%;background:#fff;border:2.5px solid var(--ink);border-radius:20px;box-shadow:var(--sh);padding:16px}
h1{font-size:26px;line-height:1.1}
.tag{display:inline-block;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:3px 12px;font-size:12px;font-weight:700;margin-bottom:8px}
.sub{font-size:14px;margin-top:6px;opacity:.8}
label{display:block;font-weight:700;font-size:14px;margin-bottom:8px}
.step{display:inline-grid;place-items:center;width:24px;height:24px;border:2px solid var(--ink);border-radius:8px;background:var(--yel);font-size:13px;margin-right:6px}
input[type=text],input[type=tel]{width:100%;font:inherit;font-weight:700;font-size:17px;padding:12px 14px;border:2.5px solid var(--ink);border-radius:14px;background:#fff;outline:none;box-shadow:3px 3px 0 var(--ink)}
input:focus{background:#FFFBEF}input:disabled{opacity:.45}
.hint{font-size:12.5px;margin-top:8px;min-height:16px}
.hint.err{color:#B3123F;font-weight:700}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tab{font:inherit;font-weight:700;font-size:15px;padding:11px 6px;border:2.5px solid var(--ink);border-radius:14px;background:#fff;box-shadow:3px 3px 0 var(--ink);cursor:pointer;color:var(--ink)}
.tab.on{background:var(--yel);transform:translate(3px,3px);box-shadow:none}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.chip{font:inherit;font-weight:700;font-size:15px;padding:12px 2px;border:2.5px solid var(--ink);border-radius:14px;background:var(--chip);box-shadow:3px 3px 0 var(--ink);cursor:pointer;color:var(--ink);transition:transform .08s,box-shadow .08s}
.chip:active,.chip.on{transform:translate(3px,3px);box-shadow:none}
.chip.on{background:var(--yel)}
.ct{display:inline-flex;border:2px solid var(--ink);border-radius:12px;background:var(--mint);overflow:hidden;box-shadow:2px 2px 0 var(--ink)}
.ctb,.ctx{font:inherit;font-weight:700;font-size:13px;padding:7px 10px;background:none;border:none;cursor:pointer;color:var(--ink)}
.ctx{border-left:2px solid var(--ink);padding:7px 9px}
.row{display:flex;justify-content:space-between;gap:10px;font-size:15px;padding:6px 0}
.row b{font-family:'Space Mono',monospace;text-align:right}
.total{border-top:2.5px dashed var(--ink);margin-top:6px;padding-top:12px;font-size:17px}
.total b{font-size:21px}
.btn{width:100%;font:inherit;font-weight:700;font-size:17px;padding:14px;border:2.5px solid var(--ink);border-radius:16px;background:var(--mint);box-shadow:var(--sh);cursor:pointer;color:var(--ink);transition:transform .08s,box-shadow .08s;text-align:center;text-decoration:none;display:block}
.btn:active{transform:translate(4px,4px);box-shadow:none}
.btn:disabled{opacity:.5;pointer-events:none}
.btn.alt{background:#fff;font-size:14px;padding:11px;box-shadow:3px 3px 0 var(--ink)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.badge{display:inline-block;border:2.5px solid var(--ink);border-radius:999px;padding:6px 16px;font-weight:700;font-size:15px}
.st-pending{background:var(--yel)}.st-success{background:var(--mint)}.st-fail{background:var(--pink)}.st-info{background:var(--lav)}
.center{text-align:center}
.qr{width:100%;max-width:320px;aspect-ratio:1;object-fit:contain;margin:14px auto;display:block;background:#fff;border:2.5px solid var(--ink);border-radius:18px;padding:8px;image-rendering:pixelated}
.amount{font-family:'Space Mono',monospace;font-size:30px;font-weight:700;margin-top:8px}
.meta{font-size:13px;opacity:.8;margin-top:8px;word-break:break-all;white-space:pre-line}
.chk{display:flex;gap:10px;align-items:center;font-weight:700;font-size:14px;margin-top:14px;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--ink)}
.hist{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;font:inherit;text-align:left;border:2px solid var(--ink);border-radius:12px;background:#fff;padding:9px 12px;margin-top:8px;cursor:pointer;color:var(--ink)}
.hist .badge{padding:2px 10px;font-size:12px;border-width:2px;white-space:nowrap}
.hist em{display:block;font-style:normal;font-size:11.5px;opacity:.65}
#histList{max-height:340px;overflow-y:auto;padding:2px 4px 4px 2px}
.spin{display:inline-block;width:14px;height:14px;border:3px solid var(--ink);border-top-color:transparent;border-radius:50%;animation:s .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
.pop{animation:p .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes p{from{transform:scale(.6);opacity:0}}
[hidden]{display:none!important}
.foot{font-size:12px;text-align:center;opacity:.7;margin-top:14px}
</style>
</head>
<body>
<div class="wrap"><div class="stack">

  <header class="card" style="background:var(--lav)">
    <span class="tag">QRIS GENERATOR</span>
    <h1>Generate QRIS<br>langsung bayar.</h1>
    <p class="sub">Pilih nominal, scan, selesai. Tanpa login.</p>
  </header>

  <div id="formView" class="stack">
    <!-- MODE DANA -->
    <div id="danaForm" class="stack">
      <div class="card">
        <label><span class="step">1</span>Nomor DANA tujuan</label>
        <input id="phone" type="tel" inputmode="numeric" placeholder="08xxxxxxxxxx" autocomplete="tel" maxlength="16">
        \1
        <div style="display:flex;gap:8px;margin-top:10px">
          <input id="cLabel" type="text" placeholder="Label (opsional)" maxlength="24" style="font-size:14px;padding:9px 12px">
          <button id="cSave" class="btn alt" style="width:auto;padding:9px 14px;white-space:nowrap">💾 Simpan</button>
        </div>
        <div id="cList" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px"></div>
      </div>
      <div class="card">
        <label><span class="step">2</span>Pilih nominal</label>
        <div id="chips" class="grid"><div class="hint" style="grid-column:1/-1"><span class="spin"></span>Memuat…</div></div>
      </div>
    </div>

    <div class="card" id="sumCard" hidden>
      <div class="row"><span>Nominal</span><b id="sNom">-</b></div>
      <div class="row total"><span>Total bayar</span><b id="sTot">-</b></div>
      <div class="hint" id="sNote"></div>
    </div>

    <button id="go" class="btn" disabled>Generate QRIS</button>
    <div id="formErr" class="hint err center"></div>
  </div>

  <section id="payView" class="card center" hidden>
    <span id="stBadge" class="badge st-pending"></span>
    <img id="qr" class="qr" alt="QRIS">
    <div id="qrFail" class="hint err" hidden>Gambar QR gagal dimuat. <a id="qrLink" target="_blank" rel="noopener">Buka QR langsung</a></div>
    <div id="pLabel" class="hint">Bayar tepat sesuai total</div>
    <div id="pAmt" class="amount">-</div>
    <div id="pInfo" class="meta"></div>
    <div id="pTimer" class="meta"></div>
    <div class="btns">
      <button id="chk" class="btn alt">Cek status</button>
      <a id="dl" class="btn alt" download="qris.png">Simpan QR</a>
    </div>
    <button id="again" class="btn" style="margin-top:14px;background:var(--peach)">Buat transaksi baru</button>
  </section>

  <section id="histCard" class="card">
    <label>Riwayat (<span id="histN">0</span>)</label>
    <div class="btns" style="margin:0 0 6px">
      <button class="btn alt" id="bk">⬇ Backup</button>
      <button class="btn alt" id="rsBtn">⬆ Restore</button>
    </div>
    <input type="file" id="rs" accept="application/json,.json" hidden>
    <div id="histNote" class="hint"></div>
    <div id="histList"></div>
  </section>

  <p class="foot">Riwayat tersimpan di browser ini · gunakan Backup agar tidak hilang</p>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const rp = n => 'Rp ' + Number(n).toLocaleString('id-ID');
const POLL_MS = 8000, MAX_WAIT = 300000, KEY = 'qris_hist_v1';
let catalog = [], picked = null, cur = null, pollT = null, tickT = null;

const loadH = () => { try { const a = JSON.parse(localStorage.getItem(KEY)); return Array.isArray(a) ? a : []; } catch { return []; } };
const saveH = h => { try { localStorage.setItem(KEY, JSON.stringify(h.slice(0, 500))); } catch {} };
function upsertH(t) { const h = loadH().filter(x => x.id !== t.id); h.unshift(t); saveH(h); renderH(); }
async function api(path, body) {
  const r = await fetch(path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : undefined);
  const j = await r.json().catch(() => ({}));
  if (!r.ok || !j.success) throw new Error(j.message || 'Terjadi kesalahan. Coba lagi.');
  return j;
}
function emv(s) { const o = {}; let i = 0; while (i + 4 <= s.length) { const l = parseInt(s.substr(i + 2, 2), 10); if (!(l >= 0)) break; o[s.substr(i, 2)] = s.substr(i + 4, l); i += 4 + l; } return o; }
const fmtNum = el => { const n = parseInt(el.value.replace(/\D/g, ''), 10) || 0; el.value = n ? n.toLocaleString('id-ID') : ''; return n; };

function refresh() {
  $('sumCard').hidden = !picked; $('go').disabled = !(picked && normPhone($('phone').value));
  if (picked) {
    $('sNom').textContent = rp(picked.nominal); $('sTot').textContent = 'Sesuai QR';
    $('sNote').textContent = 'Total pasti muncul setelah QR dibuat, sama dengan yang tampil di aplikasi DANA.';
  }
}

/* ---------- DANA: catalog, custom, phone ---------- */
async function init() {
  try { catalog = (await api('/api/catalog')).data; drawChips(); }
  catch (e) { $('chips').innerHTML = '<div class="hint err" style="grid-column:1/-1">' + e.message + '</div>'; }
  renderH(); renderC();
}
function chipBtn(label, on, fn) { const b = document.createElement('button'); b.className = 'chip'; b.textContent = label; b.onclick = fn; return b; }
function drawChips() {
  $('chips').innerHTML = '';
  catalog.forEach(p => { const b = chipBtn(p.nominal / 1000 + 'k', 0, () => pick(p)); b.dataset.id = p.id; $('chips').appendChild(b); });
}
function pick(p) { picked = p; document.querySelectorAll('#chips .chip').forEach(c => c.classList.toggle('on', !!p && +c.dataset.id === p.id)); refresh(); }
const CKEY = 'qris_contacts_v1';
const loadC = () => { try { const a = JSON.parse(localStorage.getItem(CKEY)); return Array.isArray(a) ? a : []; } catch { return []; } };
const saveC = c => { try { localStorage.setItem(CKEY, JSON.stringify(c.slice(0, 100))); } catch {} };
function renderC() {
  const box = $('cList'); box.textContent = '';
  loadC().forEach(c => {
    const w = document.createElement('span'); w.className = 'ct';
    const b = document.createElement('button'); b.className = 'ctb'; b.textContent = (c.label ? c.label + ' · ' : '') + c.phone;
    b.onclick = () => { $('phone').value = c.phone; $('phone').dispatchEvent(new Event('input')); };
    const x = document.createElement('button'); x.className = 'ctx'; x.textContent = '×'; x.setAttribute('aria-label', 'Hapus nomor');
    x.onclick = () => { saveC(loadC().filter(y => y.phone !== c.phone)); renderC(); };
    w.append(b, x); box.appendChild(w);
  });
}
$('cSave').onclick = () => {
  const p = normPhone($('phone').value), h = $('phoneHint');
  if (!p) { h.className = 'hint err'; h.textContent = 'Isi nomor yang valid dulu.'; return; }
  const c = loadC().filter(y => y.phone !== p); c.unshift({ phone: p, label: $('cLabel').value.trim().slice(0, 24) });
  saveC(c); renderC(); $('cLabel').value = ''; h.className = 'hint'; h.textContent = 'Nomor tersimpan ✓';
};
function normPhone(v) { let d = v.replace(/\D/g, ''); if (d.startsWith('62')) d = '0' + d.slice(2); return /^08\d{8,12}$/.test(d) ? d : null; }
$('phone').addEventListener('input', () => {
  const v = $('phone').value, h = $('phoneHint');
  if (!v) { h.className = 'hint'; h.textContent = 'Saldo DANA akan masuk ke nomor ini.'; }
  else if (normPhone(v)) { h.className = 'hint'; h.textContent = 'Nomor valid ✓'; }
  else { h.className = 'hint err'; h.textContent = 'Format nomor belum benar (contoh 08123456789).'; }
  refresh();
});

/* ---------- generate ---------- */
$('go').onclick = async () => {
  $('formErr').textContent = ''; $('go').disabled = true; $('go').innerHTML = '<span class="spin"></span>Membuat QRIS…';
  try {
    const phone = normPhone($('phone').value);
    const d = (await api('/api/create-transaction', { user_id: phone, product_detail_id: picked.id, payment_method: 'qris' })).data;
    const t = { id: d.transaction_id, mode: 'dana', order: d.order_id, qrUrl: d.qr_code_url, nominal: picked.nominal, price: 0, phone, status: 'PENDING', t0: Date.now() };
    upsertH(t); openTx(t);
  } catch (e) { $('formErr').textContent = e.message; }
  $('go').textContent = 'Generate QRIS'; refresh();
};

/* ---------- pay view ---------- */
function kindOf(t) {
  const s = String(t.status || '').toUpperCase();
  if (['SUCCESS', 'PAID', 'SETTLED', 'COMPLETED', 'SETTLEMENT'].includes(s)) return 'success';
  if (['FAILED', 'EXPIRED', 'CANCELLED', 'CANCELED', 'ERROR', 'DENIED'].includes(s)) return 'fail';
  return 'pending';
}
function paint(t, note) {
  const k = kindOf(t), b = $('stBadge');
  b.className = 'badge st-' + k + (k === 'success' || k === 'fail' ? ' pop' : '');
  b.textContent = ''; 
  if (k === 'pending' && !note) { const s = document.createElement('span'); s.className = 'spin'; b.append(s); }
  b.append(k === 'success' ? '✓ Berhasil' : k === 'fail' ? '✕ Gagal' : k === 'info' ? 'QRIS siap dibayar' : (note || 'Menunggu pembayaran'));
  $('chk').hidden = k === 'info' || (k !== 'pending' && !note);
}
function showAmt(t) {
  $('pLabel').textContent = 'Total bayar (sama dengan di aplikasi)';
  $('pAmt').textContent = t.price ? rp(t.price) : 'Lihat di aplikasi';
  $('pInfo').textContent = 'Top up ' + rp(t.nominal) + '\nDANA ' + t.phone + ' · Order ' + (t.order || '-');
}
function openTx(t) {
  stop(); cur = t;
  $('formView').hidden = true; $('payView').hidden = false; window.scrollTo(0, 0);
  $('qr').hidden = false; $('qrFail').hidden = true; $('pTimer').textContent = '';
  showAmt(t); paint(t);
  const src = '/api/qr/' + encodeURIComponent(t.id);
  $('qr').src = src; $('dl').href = src; $('dl').download = 'qris.png';
  $('qrLink').href = /^https:\/\//.test(t.qrUrl || '') ? t.qrUrl : '#';
  if (kindOf(t) === 'pending') { check(); startPoll(t.t0 || Date.now()); }
}
$('qr').onerror = () => { $('qr').hidden = true; $('qrFail').hidden = false; };
// Baca nominal asli dari isi QR (tag 54) supaya total sama persis dengan yang muncul di aplikasi bayar.
$('qr').onload = async () => {
  const t = cur; if (!t || t.decoded) return;
  const im = $('qr'); let text = null;
  try {
    const c = document.createElement('canvas'); c.width = im.naturalWidth; c.height = im.naturalHeight;
    const x = c.getContext('2d'); x.drawImage(im, 0, 0);
    const d = x.getImageData(0, 0, c.width, c.height);
    const r = window.jsQR && jsQR(d.data, c.width, c.height); if (r) text = r.data;
    if (!text && window.BarcodeDetector) { const b = await new BarcodeDetector({ formats: ['qr_code'] }).detect(c); if (b[0]) text = b[0].rawValue; }
  } catch {}
  const a = text && parseFloat(emv(text)['54']);
  if (cur === t && a > 0) { t.decoded = true; t.price = Math.round(a); upsertH(t); showAmt(t); }
};
function startPoll(t0) {
  const end = t0 + MAX_WAIT;
  tickT = setInterval(() => {
    const left = end - Date.now();
    if (left <= 0) { stop(); $('pTimer').textContent = ''; paint(cur, 'Waktu tunggu habis'); return; }
    $('pTimer').textContent = 'Auto-cek sisa ' + Math.floor(left / 60000) + ':' + String(Math.floor(left / 1000) % 60).padStart(2, '0');
  }, 1000);
  pollT = setInterval(check, POLL_MS);
}
function stop() { clearInterval(pollT); clearInterval(tickT); pollT = tickT = null; }
async function check() {
  if (!cur || cur.mode !== 'dana') return;
  const t = cur;
  try {
    const j = await api('/api/check-transaction', { transaction_id: t.id });
    if (cur !== t) return;
    t.status = j.data.status || 'PENDING'; upsertH(t);
    if (kindOf(t) !== 'pending') { stop(); $('pTimer').textContent = j.data.paid_at ? 'Dibayar: ' + j.data.paid_at : ''; }
    paint(t);
  } catch {}
}
$('chk').onclick = () => { if (cur && kindOf(cur) === 'pending' && !pollT) { cur.t0 = Date.now(); paint(cur); startPoll(cur.t0); } check(); };
$('again').onclick = () => { stop(); cur = null; $('payView').hidden = true; $('formView').hidden = false; window.scrollTo(0, 0); };

/* ---------- history, backup, restore ---------- */
function renderH() {
  const h = loadH().filter(t => t.mode !== 'own'), box = $('histList'); $('histN').textContent = h.length; box.textContent = '';
  if (!h.length) { const e = document.createElement('div'); e.className = 'hint'; e.textContent = 'Belum ada riwayat.'; box.appendChild(e); }
  h.forEach(t => {
    const k = kindOf(t), b = document.createElement('button'); b.className = 'hist';
    const l = document.createElement('span'), s = document.createElement('b'), em = document.createElement('em');
    s.textContent = rp(t.price || t.nominal);
    em.textContent = 'DANA ' + (t.phone || '') + ' · ' + new Date(t.t0 || 0).toLocaleString('id-ID', { dateStyle: 'short', timeStyle: 'short' });
    l.append(s, em);
    const bd = document.createElement('span'); bd.className = 'badge st-' + k; bd.textContent = { success: 'Berhasil', fail: 'Gagal', pending: 'Menunggu', info: 'QRIS' }[k];
    b.append(l, bd); b.onclick = () => openTx(t); box.appendChild(b);
  });
}
$('bk').onclick = () => {
  const blob = new Blob([JSON.stringify({ v: 2, items: loadH(), contacts: loadC() }, null, 1)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'riwayat-qris-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  $('histNote').className = 'hint'; $('histNote').textContent = 'Backup diunduh.';
};
$('rsBtn').onclick = () => $('rs').click();
$('rs').onchange = async e => {
  const f = e.target.files[0], n = $('histNote'); if (!f) return;
  try {
    const j = JSON.parse(await f.text()), arr = Array.isArray(j) ? j : j.items;
    if (!Array.isArray(arr)) throw 0;
    const ok = arr.filter(x => x && typeof x.id === 'string' && Number.isFinite(+x.price) && Number.isFinite(+x.t0));
    const m = new Map(loadH().map(x => [x.id, x])); let add = 0;
    ok.forEach(x => { if (!m.has(x.id)) { m.set(x.id, x); add++; } });
    saveH([...m.values()].sort((a, b) => b.t0 - a.t0)); renderH();
    const cs = Array.isArray(j.contacts) ? j.contacts.filter(c => c && /^08\d{8,12}$/.test(String(c.phone))).map(c => ({ phone: String(c.phone), label: String(c.label || '').slice(0, 24) })) : [];
    const have = new Set(loadC().map(c => c.phone)); saveC(loadC().concat(cs.filter(c => !have.has(c.phone)))); renderC();
    n.className = 'hint'; n.textContent = 'Restore selesai: ' + add + ' transaksi baru, ' + cs.filter(c => !have.has(c.phone)).length + ' nomor baru.';
  } catch { n.className = 'hint err'; n.textContent = 'File backup tidak valid.'; }
  e.target.value = '';
};
init();
</script>
</body>
</html>
